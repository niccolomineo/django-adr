name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  test:
    name: Test (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-24.04
    needs: [validate]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test

      # The lock file pins one Django; the matrix is the point of this job, so
      # the version under test is installed over it and the run is told not to
      # re-sync, which would put the locked one straight back.
      - name: Install Django ${{ matrix.django-version }}
        run: uv pip install "django~=${{ matrix.django-version }}.0"

      - name: Test
        run: |
          uv run --no-sync coverage run manage.py test tests --buffer --durations 10 --noinput --parallel --shuffle --timing
          uv run --no-sync coverage combine
          uv run --no-sync coverage report

  test-postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-24.04
    needs: [validate]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      ADR_DB_ENGINE: django.db.backends.postgresql
      ADR_DB_NAME: postgres
      ADR_DB_USER: postgres
      ADR_DB_PASSWORD: postgres
      ADR_DB_HOST: localhost
      ADR_DB_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group test
          uv pip install "psycopg[binary]"

      - name: Test
        run: uv run --no-sync manage.py test tests --noinput --shuffle

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [validate, test, test-postgres]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Build distributions
        run: |
          uv build
          ls dist/

      - name: Check py.typed ships in the distributions
        run: |
          unzip -l dist/*.whl | grep -q 'django_adr/py.typed'
          tar tzf dist/*.tar.gz | grep -q 'django_adr/py.typed'

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/
